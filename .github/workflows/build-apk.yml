name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop')
    permissions:
      contents: write
    steps:
      - name: 🔑 Check required build variables
        env:
          EXPO_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.EXPO_PUBLIC_GEOAPIFY_API_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_GEOAPIFY_API_KEY" ]; then
            echo "::error title=Missing secret::EXPO_PUBLIC_GEOAPIFY_API_KEY is empty. Add it under Settings > Secrets and variables > Actions; without it, location and address search fail in the app."
            exit 1
          fi

      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 💾 Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: android-sdk-${{ runner.os }}-

      - name: 💾 Cache EAS local build
        uses: actions/cache@v4
        with:
          path: ~/.eas-build-local
          key: eas-local-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: eas-local-${{ runner.os }}-

      - name: 💾 Cache Metro bundler
        uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: metro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: metro-${{ runner.os }}-

      - name: ⚡ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      # ubuntu-latest is Ubuntu 26.04 since 2026-10-19 and defaults to Java 25, which Gradle 8.14
      # rejects ("Unsupported class file major version 69"). React Native 0.81 builds with JDK 17.
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build APK
        run: eas build --platform android --profile preview --non-interactive --local --output domilix-v${{ github.run_number }}.apk
        env:
          # An unset secret expands to "": default to the production API so the
          # bundle always carries a real URL.
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://api.domilix.com' }}
          EXPO_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.EXPO_PUBLIC_GEOAPIFY_API_KEY }}

      # No AAB here: the production profile auto-increments the remote versionCode on EAS, so
      # building it on every push to main burned a number before each Play release. The signed
      # AAB is built and uploaded only by release-play.yml, on a vX.Y.Z tag.

      - name: 📥 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: domilix-android
          path: domilix-v${{ github.run_number }}.apk
          if-no-files-found: error

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Domilix v${{ github.run_number }}
          files: domilix-v${{ github.run_number }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
